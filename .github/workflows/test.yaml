---
name: Test

on:
  push:
    branches:
    - '*'
    tags-ignore:
    - '*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    # Only the container-free SQLite tier (see `make test`); the Postgres
    # integration tier needs a DesignDB container and isn't wired up yet.
    - name: Test
      run: make test
